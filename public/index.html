<!DOCTYPE html>
<html>
<head>
  <title>Smart Office Real-Time</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <h1>Smart Office - Real-time Sensor Feed</h1>
  <div class="box">
    <p>Broker: <strong><span id="broker">connecting...</span></strong></p>
    <p>MQTT events received: <span id="count">0</span></p>
    <p class="live">Latest update: <span id="latest">none</span></p>
  </div>
  <div class="box">
    <h3>Recent messages (last 30)</h3>
    <div id="messages" class="list">No messages yet.</div>
  </div>
  <script src="js/socket-io.js"></script>
  <script>
    const socket = io()
    const broker = document.getElementById('broker')
    const countEl = document.getElementById('count')
    const latestEl = document.getElementById('latest')
    const messagesEl = document.getElementById('messages')

    let count = 0
    const history = []

    socket.on('connect', () => {
      broker.textContent = 'connected'
    })
    socket.on('disconnect', () => {
      broker.textContent = 'disconnected'
    })

    socket.on('sensor-update', (data) => {
      count += 1
      countEl.textContent = count
      latestEl.textContent = `${data.topic} ${JSON.stringify(data.payload)}`
      history.unshift(`${new Date(data.timestamp).toISOString()} | ${data.topic} | ${JSON.stringify(data.payload)}`)
      if (history.length > 30) history.pop()
      messagesEl.textContent = history.join('\n')
    })
  </script>
</body>
</html>
